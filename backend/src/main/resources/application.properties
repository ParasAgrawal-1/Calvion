# =========================================================
# APPLICATION
# =========================================================

spring.application.name=calvion-backend


# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}
server.address=0.0.0.0


# =========================================================
# DATABASE
#
# LOCAL:
#   localhost:5432/datalife
#
# PRODUCTION:
#   Render PostgreSQL values are supplied as environment
#   variables from the Render dashboard.
# =========================================================

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:datalife}

spring.datasource.username=${DATABASE_USERNAME:postgres}

spring.datasource.password=${DATABASE_PASSWORD:}


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET:}

jwt.expiration=${JWT_EXPIRATION:86400000}


# =========================================================
# EMAIL / SMTP
# =========================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}

spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME:}

spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true


# =========================================================
# FRONTEND / CORS
# =========================================================

app.frontend-url=${FRONTEND_URL:http://localhost:5173}


# =========================================================
# FILE UPLOAD
# =========================================================

file.upload-dir=${FILE_UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=20MB

spring.servlet.multipart.max-request-size=100MB