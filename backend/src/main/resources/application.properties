# =========================================================
# APPLICATION
# =========================================================

spring.application.name=calvion-backend


# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}
server.address=0.0.0.0


# =========================================================
# DATABASE
#
# LOCAL:
#   localhost:5432/datalife
#
# PRODUCTION:
#   Neon PostgreSQL
#   Values are supplied through Railway environment
#   variables.
# =========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:datalife}?sslmode=${DATABASE_SSLMODE:disable}}

spring.datasource.username=${DATABASE_USERNAME:postgres}

spring.datasource.password=${DATABASE_PASSWORD:}


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

jwt.expiration=${JWT_EXPIRATION:86400000}


# =========================================================
# EMAIL / SMTP (GMAIL)
# =========================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

mail.from=${MAIL_FROM:${spring.mail.username:no-reply@calvion.com}}

# =========================================================
# FRONTEND / CORS
# =========================================================

app.frontend-url=${FRONTEND_URL:http://localhost:5173}


# =========================================================
# FILE UPLOAD
# =========================================================

file.upload-dir=${FILE_UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=20MB

spring.servlet.multipart.max-request-size=100MB


# =========================================================
# OTP MODE (false = sends real email; true = demo OTP)
# =========================================================

app.otp.demo-mode=${DEMO_OTP_MODE:false}