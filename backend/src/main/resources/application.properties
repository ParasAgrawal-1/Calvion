
# =========================================================
# ENVIRONMENT CONFIGURATION
# =========================================================

# Load backend/.env automatically
spring.config.import=file:./.env[.properties]


# =========================================================
# APPLICATION
# =========================================================

spring.application.name=calvion-backend


# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}
server.address=0.0.0.0


# =========================================================
# DATABASE - LOCAL POSTGRESQL
# =========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:datalife}?sslmode=${DATABASE_SSLMODE:disable}}

spring.datasource.username=${DATABASE_USERNAME:postgres}

# Do not silently accept an empty password
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}


# =========================================================
# EMAIL / RESEND
# =========================================================

resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}

mail.from=${resend.from}


# =========================================================
# FRONTEND / CORS
# =========================================================

app.frontend-url=${FRONTEND_URL:https://calvion.vercel.app}


# =========================================================
# FILE UPLOAD
# =========================================================

file.upload-dir=${FILE_UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB


# =========================================================
# OTP MODE
# =========================================================

app.otp.demo-mode=${DEMO_OTP_MODE:false}


# =========================================================
# CRYPTOGRAPHY
# =========================================================

crypto.secret-key=${CRYPTO_SECRET_KEY}


# =========================================================
# BREVO EMAIL
# =========================================================

brevo.api-key=${BREVO_API_KEY:}
brevo.from=${BREVO_FROM:}
